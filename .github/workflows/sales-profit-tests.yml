name: Sales Profit Intelligence Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/01-sales-profit-intelligence/**"
      - ".github/workflows/sales-profit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-sales-profit-intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pandas>=2.0,<4.0"
      - name: Run automated unit tests
        run: python -B -m unittest discover -s tests -v
