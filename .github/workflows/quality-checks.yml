name: Project quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-profit-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/01-sales-profit-intelligence/requirements.txt

      - name: Install test dependency
        run: python -m pip install "pandas>=2.0,<3.0"

      - name: Run sales metric unit tests
        working-directory: projects/01-sales-profit-intelligence
        run: python -B -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: node --check projects/01-sales-profit-intelligence/web/app.js
