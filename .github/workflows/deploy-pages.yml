name: Deploy sales profit dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage dashboard and source data
        run: |
          mkdir -p _site/projects/01-sales-profit-intelligence/web
          mkdir -p _site/projects/01-sales-profit-intelligence/data
          cp -R projects/01-sales-profit-intelligence/web/. _site/projects/01-sales-profit-intelligence/web/
          cp projects/01-sales-profit-intelligence/data/sales_data.csv _site/projects/01-sales-profit-intelligence/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
